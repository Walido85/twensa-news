name: Scrape Twensa News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Chromium
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run news scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_WEBHOOK_URL: ${{ secrets.WP_WEBHOOK_URL }}
        run: python scraper.py

      - name: Commit updated JSON
        run: |
          if [ -f news.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add news.json seen.json
            git diff --staged --quiet || git commit -m "Update news.json [skip ci]"
            git push
          else
            echo "news.json not created yet, skipping commit."
          fi
